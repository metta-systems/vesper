#
# Build nucleus
#
[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true

[tasks.build]
alias = "nucleus"

[tasks.nucleus]
workspace = false
dependencies = ["build-device", "build-kernel-binary"]
script_runner = "@duckscript"
script = [
    '''
    echo ✅ nucleus built for hw.
    echo
''',
]

# Generate a bootable binary file from KERNEL_ELF
[tasks.build-kernel-binary]
workspace = false
env = { "BINARY_FILE" = "${KERNEL_ELF}" }
run_task = "build-custom-binary"

# TODO: remove?
[tasks.kernel]
alias = "nucleus"

# Temporarily during refactoring
[tasks.kernel-binary]
disabled = true

[tasks.qemu]
clear = true
alias = "qemu-kernel"

[tasks.qemu-kernel]
env = { "QEMU_RUNNER_OPTS" = "${QEMU_SERIAL_OPTS}", "TARGET_DTB" = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/targets/bcm2710-rpi-3-b-plus.dtb" }
extend = "qemu-runner"

[tasks.qemu-gdb]
env = { "QEMU_RUNNER_OPTS" = "${QEMU_SERIAL_OPTS} ${QEMU_DISASM_OPTS} ${QEMU_GDB_OPTS}", "TARGET_DTB" = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/targets/bcm2710-rpi-3-b-plus.dtb" }
extend = "qemu-runner"

[tasks.zellij-nucleus]
alias = "zellij-nucleus-override"

[tasks.zellij-nucleus-override]
env = { "KERNEL_BIN" = "${KERNEL_BIN}", "QEMU_RUNNER_OPTS" = "${QEMU_SERIAL_OPTS} ${QEMU_DISASM_OPTS} ${QEMU_GDB_OPTS}", "TARGET_DTB" = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/targets/bcm2710-rpi-3-b-plus.dtb" }
run_task = "zellij-config"

[tasks.gdb]
dependencies = ["build", "gdb-config"]
env = { "RUST_GDB" = "${GDB}" }
script = [
    "exec < /dev/tty && pipx run gdbgui -g \"rust-gdb -x ${GDB_CONNECT_FILE} ${KERNEL_ELF}\"",
]

[tasks.install-nm]
install_crate = { crate_name = "cargo-binutils", binary = "rust-nm", test_arg = [
    "--help",
] }

[tasks.install-rustfilt]
install_crate = { crate_name = "rustfilt", binary = "rustfilt", test_arg = [
    "--help",
] }

[tasks.xtool-nm]
dependencies = ["build", "install-nm", "install-rustfilt"]
script = ["${NM} ${KERNEL_ELF} | sort -k 1 | rustfilt"]

[tasks.sdcard] # kernel-sdcard ?
dependencies = ["build"]
script_runner = "@duckscript"
script = ['''
    kernelImage = set "kernel8.img"
    cp ${KERNEL_BIN} ${VOLUME}/${kernelImage}
    echo 🔄 Copied nucleus to ${VOLUME}/${kernelImage}
''']

[tasks.hopper]
clear = true
alias = "kernel-hopper"

[tasks.kernel-hopper]
dependencies = ["build"]
# The cmd line below causes a bug in hopper, see https://www.dropbox.com/s/zyw5mfx0bepcjb1/hopperv4-RAW-bug.mov?dl=0
# "hopper --loader RAW --base-address 0x80000 --entrypoint 0x80000 --file-offset 0 --plugin arm --cpu aarch64 --variant generic --contains-code true --executable ${KERNEL_BIN}"
script = ["hopper --loader ELF --executable ${KERNEL_ELF}"]

[tasks.clippy]
workspace = false
dependencies = ["xtool-clippy"]
