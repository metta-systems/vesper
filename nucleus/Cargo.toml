[package]
name = "nucleus"
description = "Vesper nanokernel binary"
authors.workspace = true
categories.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[badges]
maintenance = { status = "experimental" }

[features]
default = []
noserial = ["machine/noserial"]
# Enable JTAG debugging of kernel - enable jtag helpers and
# block waiting for JTAG probe attach at the start of kernel main.
jtag = ["machine/jtag"]
# Build for running under QEMU with semihosting, so various halt/reboot options would for example quit QEMU instead.
qemu = ["machine/qemu"]
# Mutually exclusive features to choose a target board
rpi3 = ["machine/rpi3"]
rpi4 = ["machine/rpi4"]

[dependencies]
machine = { path = "../machine" }
aarch64-cpu.workspace = true
armv8a_semihosting = { git = "https://github.com/metta-systems/armv8a-semihosting", version = "0.0", branch = "fix/int-drop" }
armv8a_panic_semihosting = { version = "0.0", features = ["info"] }
bit_field.workspace = true
bitflags.workspace = true
cfg-if.workspace = true
snafu.workspace = true
tock-registers.workspace = true
usize_conversions.workspace = true
ux.workspace = true

[[bin]]
name = "nucleus"
test = false
