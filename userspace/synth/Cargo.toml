[package]
name = "vesper-synth"

description = "Integer SoundFont 2 wavetable synthesiser and Standard MIDI File sequencer for Wood's music on Vesper: no_std + alloc, no floating point."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

build = "build.rs"

[features]
default = []
# Opt in to the host integration tests. The tests on Doom's music (the IWAD
# and the SC-55 bank) are in vesper-doom's Room: `just test-music` there.
host-tests = []

[[test]]
name = "synth"
required-features = ["host-tests"]

[lints]
workspace = true
