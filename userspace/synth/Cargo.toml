[package]
name = "vesper-synth"

description = "SoundFont 2 wavetable synthesiser and Standard MIDI File sequencer for Wood's music on Vesper: no_std + alloc, integer, with an f64 engine behind the fp-mode feature."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

build = "build.rs"

[features]
default = []
# Opt in to the host integration tests. The tests on Doom's music (the IWAD
# and the SC-55 bank) are in vesper-doom's Room: `just test-music` there.
host-tests = []
# The f64 engine beside the integer one (AUDIO-20), chosen at run
# time with `Synth::set_engine`. Without it the crate holds no floating point.
fp-mode = ["dep:libm"]

[dependencies]
libm = { workspace = true, optional = true }

[[test]]
name = "synth"
required-features = ["host-tests"]

[lints]
workspace = true
