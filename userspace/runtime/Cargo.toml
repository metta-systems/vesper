[package]
name = "vesper-user-runtime"

description = "Runtime for Vesper EL0 userspace components: entry glue, panic handler and the default PPC Return-fault handler."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
default = []
# Report panics and exit QEMU through semihosting (needs semihosting enabled
# for EL0, `-semihosting-config userspace=on`).
qemu = []

[dependencies]
cfg-if = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libqemu = { workspace = true }

[lints]
workspace = true
