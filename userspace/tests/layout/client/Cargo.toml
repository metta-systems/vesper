[package]
name = "layout-client"

description = "layout-test's client: reads the compositor's outputs through display_layout_v1 and, loaded with layout = true, turns and moves them and reads them back."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
default = []
qemu = ["libuser/qemu"]

[dependencies]
compositor-client = { workspace = true }
driver-protocol = { workspace = true }
libdevice-driver = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libuser = { workspace = true }

[[bin]]
name = "layout-client"
test = false

[lints]
workspace = true
