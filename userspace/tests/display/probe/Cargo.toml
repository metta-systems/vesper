[package]
name = "display-test-probe"

description = "display-test's program: checks the fb component as a scanout output of display_v1 (its description, modes and refusals) and reports."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
default = []
qemu = ["libuser/qemu", "liblog-client/qemu"]

[dependencies]
display = { workspace = true }
display-client = { workspace = true }
driver-protocol = { workspace = true }
libdevice-driver = { workspace = true }
# The probe's lines, its fault handler and its panic reporter.
liblog-client = { workspace = true }
libmeddle-runtime = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libuser = { workspace = true }

[[bin]]
name = "display-test-probe"
test = false

[lints]
workspace = true
