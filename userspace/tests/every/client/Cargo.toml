[package]
name = "every-client"

description = "every-test's client: imports echo_v1 via every, calls each instance it was linked to and reports."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
default = []
qemu = ["libuser/qemu"]

[dependencies]
driver-protocol = { workspace = true }
echo = { workspace = true }
echo-client = { workspace = true }
libdevice-driver = { workspace = true }
libmeddle-runtime = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libuser = { workspace = true }

[[bin]]
name = "every-client"
test = false

[lints]
workspace = true
