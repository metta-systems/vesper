[package]
name = "pci-probe"

description = "board-test driver of the function behind the PCIe root port (the Raspberry Pi 4's VL805, the Raspberry Pi 5's RP1): claims it through pci_v1, logs its BARs and first register, and checks that an MSI raised in software reaches its Notification."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
default = []
qemu = ["libuser/qemu", "liblog-client/qemu"]

[dependencies]
libdevice-driver = { workspace = true }
liblog-client = { workspace = true }
libmeddle-runtime = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libuser = { workspace = true }
pci = { workspace = true }
pci-client = { workspace = true }

[[bin]]
name = "pci-probe"
test = false

[lints]
workspace = true
