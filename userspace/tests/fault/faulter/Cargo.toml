[package]
name = "fault-faulter"

description = "fault-test EL0 component with a fault handler: skip, retry, Return fault, terminate, nested and busy-handler scenarios."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
default = []
qemu = ["libuser/qemu"]

[dependencies]
fault-protocol = { path = "../protocol" }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libuser = { workspace = true }

[[bin]]
name = "fault-faulter"
test = false

[lints]
workspace = true
