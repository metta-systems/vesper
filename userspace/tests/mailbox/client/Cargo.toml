[package]
name = "mailbox-test-client"

description = "mailbox-test EL0 driver on the firmware power node: calls the mailbox component through its imports and reports."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
default = []
qemu = ["libuser/qemu"]

[dependencies]
driver-protocol = { path = "../../driver/protocol" }
libdevice-driver = { workspace = true }
libmeddle-runtime = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libuser = { workspace = true }
mailbox-client = { workspace = true }

[[bin]]
name = "mailbox-test-client"
test = false

[lints]
workspace = true
