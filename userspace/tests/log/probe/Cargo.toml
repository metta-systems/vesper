[package]
name = "log-probe"

description = "log-test program: one Thread overflows its stack and the other panics, so their FAULT: and PANICKED: lines must reach the UART through the log server."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
default = []
qemu = ["libuser/qemu", "liblog-client/qemu"]

[dependencies]
libdevice-driver = { workspace = true }
# The probe's lines, its fault handler and its panic reporter.
liblog-client = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libuser = { workspace = true }

[[bin]]
name = "log-probe"
test = false

[lints]
workspace = true
