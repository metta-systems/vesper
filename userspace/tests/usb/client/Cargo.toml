[package]
name = "usb-test-client"

description = "usb-test program: enumerates the root device through the usb_hcd_v1 import, checks the pipe rules of the DWC2 host controller component and reports."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
default = []
qemu = ["libuser/qemu"]

[dependencies]
driver-protocol = { path = "../../driver/protocol" }
libdevice-driver = { workspace = true }
libio-channel = { workspace = true }
libmeddle-runtime = { workspace = true }
libobject = { workspace = true }
usb-host = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libuser = { workspace = true }
usb-hcd-client = { workspace = true }
vesper-usb-protocol = { path = "../../../../drivers/usb/protocol" }

[[bin]]
name = "usb-test-client"
test = false

[lints]
workspace = true
