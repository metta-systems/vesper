[package]
name = "endpoint-server"

description = "EL0 server of the endpoint-test rendezvous: receives requests from the endpoint component and replies."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
default = []
qemu = ["libuser/qemu"]

[dependencies]
endpoint-protocol = { path = "../protocol" }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libuser = { workspace = true }

[[bin]]
name = "endpoint-server"
test = false

[lints]
workspace = true
