[package]
name = "driver-probe"

description = "driver-test EL0 driver: checks the init page Kickstart hands a driver, maps its registers, acks its interrupts and reports."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
default = []
qemu = ["libuser/qemu"]

[dependencies]
driver-protocol = { path = "../protocol" }
libdevice-driver = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libuser = { workspace = true }

[[bin]]
name = "driver-probe"
test = false

[lints]
workspace = true
