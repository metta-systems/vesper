[package]
name = "fp-probe"

description = "Negative-test EL0 component: executes one FP/SIMD instruction and reports whether it trapped."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
default = []
qemu = ["libuser/qemu"]

[dependencies]
fp-trap-protocol = { path = "../protocol" }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libuser = { workspace = true }

[[bin]]
name = "fp-probe"
test = false

[lints]
workspace = true
