[package]
name = "audio-test-client"

description = "audio-test program: streams PCM to the PWM audio driver through its audio_v1 import; a tone on each side of the jack on the board, the capture test's pattern under QEMU."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
default = []
# Under QEMU the program runs the capture test instead of playing a tone.
qemu = ["libuser/qemu"]

[dependencies]
audio-client = { workspace = true }
# The tone, the client frame layout and the capture test's pattern.
audio-pwm-bcm2835 = { workspace = true }
driver-protocol = { workspace = true }
libdevice-driver = { workspace = true }
libio-channel = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libuser = { workspace = true }

[[bin]]
name = "audio-test-client"
test = false

[lints]
workspace = true
