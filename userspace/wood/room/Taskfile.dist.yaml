# https://github.com/go-task/task
version: "3"

tasks:
  fmt:
    desc: Format the code
    preconditions:
      - sh: command -v cargo >/dev/null 2>&1
        msg: cargo is not installed. Please install Rust via https://rustup.rs
    cmds:
      - cargo fmt

  lint:
    desc: Lint the code
    preconditions:
      - sh: command -v cargo >/dev/null 2>&1
        msg: cargo is not installed. Please install Rust via https://rustup.rs
    cmds:
      - cargo clippy --all-targets

  lint:fix:
    desc: Lint the code
    preconditions:
      - sh: command -v cargo >/dev/null 2>&1
        msg: cargo is not installed. Please install Rust via https://rustup.rs
    cmds:
      - cargo clippy --fix --allow-staged
      - task: fmt

  test:
    desc: Run all tests
    preconditions:
      - sh: command -v cargo >/dev/null 2>&1
        msg: cargo is not installed. Please install Rust via https://rustup.rs
    env:
      RUST_BACKTRACE: full
      RUST_LOG: info
    cmds:
      - cargo test

  check:
    desc: Check the workspace
    preconditions:
      - sh: command -v cargo >/dev/null 2>&1
        msg: cargo is not installed. Please install Rust via https://rustup.rs
    cmds:
      - cargo check

  build:
    desc: Build the workspace
    preconditions:
      - sh: command -v cargo >/dev/null 2>&1
        msg: cargo is not installed. Please install Rust via https://rustup.rs
    cmds:
      - cargo build

  run:
    desc: Run the game
    preconditions:
      - sh: command -v cargo >/dev/null 2>&1
        msg: cargo is not installed. Please install Rust via https://rustup.rs
    env:
      RUST_BACKTRACE: full
      RUST_LOG: info
    cmds:
      - cargo run --bin room

  docs:
    desc: Build rustdoc
    aliases:
      - doc
    preconditions:
      - sh: command -v cargo >/dev/null 2>&1
        msg: cargo is not installed. Please install Rust via https://rustup.rs
    cmds:
      - "cargo doc --no-deps --all-features"

  docs:open:
    desc: Build rustdoc (and open them)
    aliases:
      - doc:open
    preconditions:
      - sh: command -v cargo >/dev/null 2>&1
        msg: cargo is not installed. Please install Rust via https://rustup.rs
    cmds:
      - "cargo doc --no-deps --all-features --open"

  asan:test:
    desc: Run tests with AddressSanitizer (nightly required)
    preconditions:
      - sh: command -v cargo >/dev/null 2>&1
        msg: cargo is not installed. Please install Rust via https://rustup.rs
    env:
      ASAN: "1"
      ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=1:symbolize=1"
      RUST_BACKTRACE: "1"
      RUSTFLAGS: "-Zsanitizer=address"
    cmds:
      - cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu {{.CLI_ARGS}}

  asan:run:
    desc: Run the game with AddressSanitizer (nightly required)
    preconditions:
      - sh: command -v cargo >/dev/null 2>&1
        msg: cargo is not installed. Please install Rust via https://rustup.rs
    env:
      ASAN: "1"
      ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=1:symbolize=1"
      RUST_BACKTRACE: "1"
      RUSTFLAGS: "-Zsanitizer=address"
    cmds:
      - cargo +nightly run -Zbuild-std --target x86_64-unknown-linux-gnu {{.CLI_ARGS}}
