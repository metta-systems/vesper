[workspace]

[package]
name = "room"
version = "0.1.0"
edition = "2024"
description = "A Rust implementation of Doom Generic"
repository = "https://github.com/sunsided/room"
license = "GPL-2.0"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
readme = "README.md"

[lib]
name = "room"
path = "src/lib.rs"

[[bin]]
name = "room"
path = "src/main.rs"

[features]
dhat-heap = ["dep:dhat"]
rangecheck = []
# Build the binary with the placeholder Vesper platform (src/platform/vesper)
# instead of the winit/wgpu/rodio host platform, to compile-check it on a host.
platform-vesper = []

[dependencies]
# Cross-platform window creation and event handling.
winit = "0.30"

# Cross-platform GPU API.
wgpu = { version = "29", features = ["wgsl"] }

# Blocking async executor – used to wait for wgpu futures.
pollster = "0.4"

# Safe transmutation between byte slices and typed buffers.
bytemuck = { version = "1", features = ["derive"] }

# Zero-copy views of the little-endian WAD on-disk records.
zerocopy = { version = "0.8", features = ["derive"] }

# Logging facade.
log = "0.4"

# Cross-platform audio playback, used for SFX.
rodio = "0.22"

# Pure-Rust SF2 soundfont synthesizer, used for Doom music playback.
rustysynth = "1"

# Simple logger backed by stderr.
env_logger = "0.11"

# Optional heap profiler (use with --features dhat-heap).
dhat = { version = "0.3", optional = true }

[lints.rust]
# Vesper's custom target sets `target_os = "vesper"` (src/platform/mod.rs).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("vesper"))'] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 's'
