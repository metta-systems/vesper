[package]
name = "wood"

description = "Wood: the Room Doom engine as a Vesper program, drawing in a window of the compositor and reading the WAD from a bundled resource."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
default = []
# The engine's log and the frame trace on the semihosting console too.
qemu = ["libuser/qemu", "liblog-client/qemu"]

[target.'cfg(target_os = "vesper")'.dependencies]
audio-client = { workspace = true }
# The audio_v1 io-channel's layout.
audio-pwm-bcm2835 = { workspace = true }
compositor-client = { workspace = true }
libcompositor-core = { workspace = true }
libdevice-driver = { workspace = true }
libheap = { workspace = true }
libio-channel = { workspace = true }
# The engine's log, to the log server.
liblog-client = { workspace = true }
# The ARM and core clocks, logged when the music starts.
mailbox-client = { workspace = true }
libmeddle-runtime = { workspace = true }
libobject = { workspace = true }
# The midi_synth_v1 packet protocol and the data pages' layout.
midi-synth = { workspace = true }
midi-synth-client = { workspace = true }
libuser = { workspace = true }
log = { workspace = true }
room = { workspace = true }
vesper-input-event = { workspace = true }

[[bin]]
name = "wood"
path = "src/main.rs"
test = false

[lints]
workspace = true
