[package]
name = "wood"

description = "Wood: the Room Doom engine as a Vesper program, drawing in a window of the compositor and reading the WAD from a bundled resource."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
default = []
# The engine's log and the frame trace on the semihosting console.
qemu = ["libuser/qemu"]

[target.'cfg(target_os = "vesper")'.dependencies]
compositor-client = { workspace = true }
libcompositor-core = { workspace = true }
libdevice-driver = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libuser = { workspace = true }
log = { workspace = true }
rlsf = { workspace = true }
room = { workspace = true }

[[bin]]
name = "wood"
path = "src/main.rs"
test = false

[lints]
workspace = true
