[package]
name = "midi-synth"

description = "The MIDI synthesiser component: Wood's music on Vesper, Standard MIDI Files in and rendered frames out on midi_synth_v1's io-channel, played by wood-synth with a bundled SoundFont."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

publish = false

[features]
default = []
# Opt in to the host integration tests of the session (they read the IWAD
# and the SC-55 bank from the repository).
host-tests = []
# The component's lines on the semihosting console under QEMU.
qemu = ["libserial-trace/qemu", "libuser/qemu"]

[dependencies]
libio-channel = { workspace = true }
wood-synth = { workspace = true }

# The component itself only builds for Vesper; host tests use the library.
[target.'cfg(target_os = "vesper")'.dependencies]
libdevice-driver = { workspace = true }
libheap = { workspace = true }
libmeddle-runtime = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libserial-trace = { workspace = true }
libuser = { workspace = true }
midi-synth-server = { workspace = true }

[dev-dependencies]
# Room's MUS to MIDI converter makes the test songs, as the game does.
room = { workspace = true }

[lib]
test = false
harness = false

[[bin]]
name = "midi-synth"
path = "src/main.rs"
test = false

[[test]]
name = "session"
required-features = ["host-tests"]

[lints]
workspace = true
