# Room is a workspace of its own (its host platform, tests and tools); Wood
# links its engine library by path.
exclude = ["userspace/wood/room"]
resolver = "3"

[workspace.package]
authors = ["Berkus Decker <berkus+vesper@metta.systems>"]
categories = ["embedded", "no-std", "os"]
documentation = "https://docs.metta.systems/vesper"
edition = "2024"
license = "BlueOak-1.0.0"
publish = false
readme = "README.md"
repository = "https://github.com/metta-systems/vesper"
version = "0.0.1"

