[package]
name = "endpoint-test"

description = "Vesper end-to-end test kernel: a third-party rendezvous endpoint component between client and server AddressSpaces, over PPC Invocation, Notification and EventCount."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
default = []
debug_kernel = ["kickstart/debug_kernel", "libkicktest/debug_kernel", "libobject/debug_kernel", "nucleus/debug_kernel"]
jtag = ["kickstart/jtag"]
noserial = []
# Build for running under QEMU with semihosting, so exit reports the result.
qemu = [
  "kickstart/qemu",
  "libexception/qemu",
  "libkicktest/qemu",
  "libmachine/qemu",
  "nucleus/qemu",
]

[dependencies]
aarch64-cpu = { workspace = true }
cfg-if = { workspace = true }
kickstart = { path = "../kickstart" }
libaddress = { workspace = true }
libboot = { workspace = true }
libcpu = { workspace = true }
libexception = { workspace = true }
libkicktest = { workspace = true }
libmachine = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libqemu = { workspace = true }
nucleus = { path = "../nucleus" }

[[bin]]
name = "endpoint-test"
test = false  # the e2e assertions run in-guest through `just test-endpoint`

[lints]
workspace = true
