# What panel-test bundles (see vesper-image-build): only what the SPI panel
# needs on a board, whose lines the log server writes on the UART: the PL011,
# the mailbox (the core clock's fastest rate), the gpio component (the SPI
# pins and the panel's lines), the spi component on SPI0 and the ILI9341 panel
# driver on it, both reading their nodes from device tree copies. The board's
# `mipi-dbi-spi` overlay (tools/makesd/boot/config.txt) enables SPI0 and puts
# the panel on it.

[[driver]]
name = "uart"
binary = "uart-pl011"

[[component]]
name = "log_server"
binary = "log-server"
interfaces = "../../../userspace/log-server/interfaces"
active = true
program = true
serial = true

[[driver]]
name = "mailbox"
binary = "mailbox"
interfaces = "../../../drivers/mailbox/interfaces"

[[driver]]
name = "gpio"
binary = "gpio-bcm2835"
interfaces = "../../../drivers/gpio-bcm2835/interfaces"

[[driver]]
name = "spi"
binary = "spi-bcm2835"
interfaces = "../../../drivers/spi-bcm2835/interfaces"
device_tree = true

[[driver]]
name = "panel"
binary = "panel-ili9341"
interfaces = "../../../drivers/panel-ili9341/interfaces"
device_tree = true

# The root dispatcher: Kickstart binds it once every other program and driver
# is loaded, and registers the boot Thread with it.
[[component]]
name = "dispatcher"
binary = "root-dispatcher"
active = true
program = true
dispatcher = true
