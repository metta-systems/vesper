# What usb-core-test bundles (see vesper-image-build): the DWC2 host controller
# component, loaded by Kickstart once per enabled `brcm,bcm2708-usb` node, the
# PL011 driver whose serial channel carries the USB core's trace, and the USB
# core itself. The core is a program (a component with `program = true`):
# Kickstart starts it at boot, without a device tree node. It imports
# usb_hcd_v1 through the controller's compatible string.

# The mailbox component, through which the controller's power domain is switched on.
[[driver]]
name = "mailbox"
binary = "mailbox"
interfaces = "../../../drivers/mailbox/interfaces"

[[driver]]
name = "usb"
binary = "usb-hcd-dwc2"
interfaces = "../../../drivers/usb-hcd-dwc2/interfaces"

[[driver]]
name = "uart"
binary = "uart-pl011"

[[component]]
name = "usb_core"
binary = "usb-core"
interfaces = "../../../drivers/usb/interfaces"
active = true
program = true
serial = true

# The root dispatcher: Kickstart binds it once every other program and driver
# is loaded, and registers the boot Thread with it.
[[component]]
name = "dispatcher"
binary = "root-dispatcher"
active = true
program = true
dispatcher = true
