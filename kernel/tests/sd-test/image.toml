# What sd-test bundles (see vesper-image-build): the SDHOST component, loaded
# by Kickstart for the enabled `brcm,bcm2835-sdhost` node, and a test client.
# The client is a program (a component with `program = true`): Kickstart
# starts it at boot, without a device tree node, with an extra Thread. It
# imports block_v1 through the controller's compatible string.

# The mailbox component, through which the controller learns the core clock.
[[driver]]
name = "mailbox"
binary = "mailbox"
interfaces = "../../../drivers/mailbox/interfaces"

# The gpio component, through which the controller routes the card's pins.
[[driver]]
name = "gpio"
binary = "gpio-bcm2835"
interfaces = "../../../drivers/gpio-bcm2835/interfaces"

[[driver]]
name = "sd"
binary = "sdhost-bcm2835"
interfaces = "../../../drivers/sdhost-bcm2835/interfaces"

[[component]]
name = "client"
binary = "sd-test-client"
interfaces = "../../../userspace/tests/sd/client/interfaces"
active = true
program = true

# The root dispatcher: Kickstart binds it once every other program and driver
# is loaded, and registers the boot Thread with it.
[[component]]
name = "dispatcher"
binary = "root-dispatcher"
active = true
program = true
dispatcher = true
