[package]
name = "ppc-test"

description = "Vesper end-to-end test kernel: Invocation construction and same-Thread PPC Call/Return into the Bounce fixture AddressSpace."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
default = []
# The e2e capability suite runs through the debug-only console/demonstration
# gates of the shared boot path.
debug_kernel = ["kickstart/debug_kernel", "libkicktest/debug_kernel", "libobject/debug_kernel", "nucleus/debug_kernel"]
# Enable JTAG debugging of the test kernel - enable jtag helpers and
# block waiting for JTAG probe attach at the start of kernel main.
jtag = ["kickstart/jtag"]
noserial = []
# Build for running under QEMU with semihosting, so various halt/reboot options would for example quit QEMU instead.
qemu = [
  "kickstart/qemu",
  "libexception/qemu",
  "libkicktest/qemu",
  "libmachine/qemu",
  "nucleus/qemu",
]

[dependencies]
aarch64-cpu = { workspace = true }
cfg-if = { workspace = true }
kickstart = { path = "../../kickstart" }
libaddress = { workspace = true }
libboot = { workspace = true }
libcpu = { workspace = true }
libexception = { workspace = true }
libkicktest = { workspace = true }
liblog = { workspace = true }
libmachine = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libqemu = { workspace = true }
nucleus = { path = "../../nucleus" }

[[bin]]
name = "ppc-test"
test = false  # the e2e assertions run in-guest through `just test-ppc`

[lints]
workspace = true
