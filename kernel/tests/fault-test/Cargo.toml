[package]
name = "fault-test"

description = "Vesper end-to-end test kernel: fault delivery to EL0 fault handlers — skip, retry, terminate, Return faults and every unhandled case."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
default = []
debug_kernel = ["kickstart/debug_kernel", "libkicktest/debug_kernel", "libobject/debug_kernel", "nucleus/debug_kernel"]
jtag = ["kickstart/jtag"]
noserial = []
# Build for running under QEMU with semihosting, so exit reports the result.
qemu = [
  "kickstart/qemu",
  "libexception/qemu",
  "libkicktest/qemu",
  "libmachine/qemu",
  "nucleus/qemu",
]

[dependencies]
aarch64-cpu = { workspace = true }
cfg-if = { workspace = true }
fault-protocol = { path = "../../../userspace/tests/fault/protocol" }
kickstart = { path = "../../kickstart" }
libaddress = { workspace = true }
libboot = { workspace = true }
libcpu = { workspace = true }
libexception = { workspace = true }
libimage = { workspace = true }
libkicktest = { workspace = true }
libmachine = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libqemu = { workspace = true }
nucleus = { path = "../../nucleus" }

[build-dependencies]
libimage-build = { workspace = true }

[[bin]]
name = "fault-test"
test = false  # the e2e assertions run in-guest through `just test-fault`

[lints]
workspace = true
