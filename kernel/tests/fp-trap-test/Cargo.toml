[package]
name = "fp-trap-test"

description = "Vesper end-to-end negative test kernel: FP/SIMD instructions trap at EL1t and at EL0 under the integer-only policy."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
default = []
debug_kernel = ["kickstart/debug_kernel", "libkicktest/debug_kernel", "libobject/debug_kernel", "nucleus/debug_kernel"]
jtag = ["kickstart/jtag"]
noserial = []
# Build for running under QEMU with semihosting, so exit reports the result.
qemu = [
  "kickstart/qemu",
  "libexception/qemu",
  "libkicktest/qemu",
  "libmachine/qemu",
  "nucleus/qemu",
]
# The nucleus hook that absorbs FP/SIMD traps; `just build-fp-trap-test` builds the nucleus with it.
fp_trap_test = [
  "nucleus/fp_trap_test",
]

[dependencies]
aarch64-cpu = { workspace = true }
cfg-if = { workspace = true }
fp-trap-protocol = { path = "../../../userspace/tests/fp-trap/protocol" }
kickstart = { path = "../../kickstart" }
libaddress = { workspace = true }
libboot = { workspace = true }
libcpu = { workspace = true }
libexception = { workspace = true }
libimage = { workspace = true }
libkicktest = { workspace = true }
libmachine = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libqemu = { workspace = true }
nucleus = { path = "../../nucleus" }

[build-dependencies]
libimage-build = { workspace = true }

[[bin]]
name = "fp-trap-test"
test = false  # the e2e assertions run in-guest through `just test-fp-trap`

[lints]
workspace = true
