# What fp-trap-test bundles (see vesper-image-build): its EL0 probe
# component. `binary` is the cargo binary name, built with
# userspace/runtime/user.ld.

[[component]]
name = "probe"
binary = "fp-probe"
active = true
# It executes an FP/SIMD instruction on purpose, to show that it traps.
expects_fp_trap = true
