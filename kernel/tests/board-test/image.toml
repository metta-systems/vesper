# What board-test bundles (see vesper-image-build): the drivers being brought
# up on new boards, whose lines the log server writes on the UART; Kickstart
# itself prints on semihosting only once it drops to EL1.

[[driver]]
name = "uart"
binary = "uart-pl011"

[[component]]
name = "log_server"
binary = "log-server"
interfaces = "../../../userspace/log-server/interfaces"
active = true
program = true
serial = true

# The mailbox component, through which the SD controller may learn its base
# clock.
[[driver]]
name = "mailbox"
binary = "mailbox"
interfaces = "../../../drivers/mailbox/interfaces"

# The SD card controller (EMMC2 on the Raspberry Pi 4, the SD controller on
# the Raspberry Pi 5): it logs its bring-up and reads block 0, and writes
# nothing to the card.
[[driver]]
name = "sd"
binary = "sdhci"
interfaces = "../../../drivers/sdhci/interfaces"
memory = 131072

# The PCIe root complex (the VL805's on the Raspberry Pi 4, RP1's on the
# Raspberry Pi 5): it logs the link, the functions behind it with their BARs,
# and whether an MSI raised in software arrives; then it serves pci_v1.
[[driver]]
name = "pcie"
binary = "pcie-brcmstb"
interfaces = "../../../drivers/pcie-brcmstb/interfaces"
pci_host = true

# The Raspberry Pi 4's VL805 USB controller, by its node (it has no compatible
# string): it has the firmware load the controller, claims it through pci_v1,
# brings it up, checks a command completes on its MSI, and resets the USB 2
# ports a device is connected to, logging each step. The upstream tree names
# the node `pci@1,0/usb@1,0`, the one the Pi 4 firmware ships `pci@0,0/usb@0,0`.
[[driver]]
name = "xhci"
binary = "usb-hcd-xhci"
interfaces = "../../../drivers/usb-hcd-xhci/interfaces"
nodes = [
    "/scb/pcie@7d500000/pci@1,0/usb@1,0",
    "/scb/pcie@7d500000/pci@0,0/usb@0,0",
]
# The rings, the context page, the control transfers' data page and up to 31
# scratchpad buffers, and three pages for each device it addresses (up to 8):
# past 256 KiB, and memory comes in powers of two.
memory = 524288

# The USB core, on the Raspberry Pi 4's xHCI driver (its import's `or
# component xhci`): it resets the root port, has the controller address the
# VIA hub there and enumerates it and the devices on its ports, logging each
# control transfer; the hub's Status Change endpoint names the ports to look
# at. Elsewhere it links no controller and says so.
[[component]]
name = "usb_core"
binary = "usb-core"
interfaces = "../../../drivers/usb/interfaces"
active = true
program = true

# The USB HID driver on the same controller: it claims a boot keyboard or
# mouse behind the hub and reads its reports through an interrupt pipe.
[[component]]
name = "usb_hid"
binary = "usb-hid"
interfaces = "../../../drivers/usb-hid/interfaces"
active = true
program = true

# Its consumer: it logs each device usb-hid serves and every key and motion.
[[component]]
name = "input_trace"
binary = "input-trace"
interfaces = "../../../userspace/tests/input/trace/interfaces"
active = true
program = true

# log-test's probe, loaded on the boards only and only with
# `--cfg test_boot_panic` (under QEMU its panic would end the run): its first
# Thread panics on purpose and its second overflows its
# stack, to show both reach the UART, the panic through the debug console in a
# `debug_kernel` kernel as well as through the log server.
[[component]]
name = "log_probe"
binary = "log-probe"
interfaces = "../../../userspace/tests/log/probe/interfaces"
active = true
program = true

# The Raspberry Pi 5's RP1 behind the root port, by its node (it has no
# compatible string either): it claims the function through pci_v1, logs its
# BARs and first register, and checks that it has no MSI (RP1 has MSI-X only).
[[driver]]
name = "pci_probe"
binary = "pci-probe"
interfaces = "../../../userspace/tests/pci/probe/interfaces"
nodes = ["/axi/pcie@1000120000/rp1"]

# The root dispatcher: Kickstart binds it once every other program and driver
# is loaded, and registers the boot Thread with it.
[[component]]
name = "dispatcher"
binary = "root-dispatcher"
active = true
program = true
dispatcher = true
