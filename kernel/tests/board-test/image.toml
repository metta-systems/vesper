# What board-test bundles (see vesper-image-build): the drivers being brought
# up on new boards, whose lines the log server writes on the UART; Kickstart
# itself prints on semihosting only once it drops to EL1.

[[driver]]
name = "uart"
binary = "uart-pl011"

[[component]]
name = "log_server"
binary = "log-server"
interfaces = "../../../userspace/log-server/interfaces"
active = true
program = true
serial = true

# The mailbox component, through which the SD controller may learn its base
# clock.
[[driver]]
name = "mailbox"
binary = "mailbox"
interfaces = "../../../drivers/mailbox/interfaces"

# The SD card controller (EMMC2 on the Raspberry Pi 4, the SD controller on
# the Raspberry Pi 5): it logs its bring-up and reads block 0, and writes
# nothing to the card.
[[driver]]
name = "sd"
binary = "sdhci"
interfaces = "../../../drivers/sdhci/interfaces"
memory = 131072

# The PCIe root complex (the VL805's on the Raspberry Pi 4, RP1's on the
# Raspberry Pi 5): it logs the link, the functions behind it with their BARs,
# and whether an MSI raised in software arrives; then it serves pci_v1.
[[driver]]
name = "pcie"
binary = "pcie-brcmstb"
interfaces = "../../../drivers/pcie-brcmstb/interfaces"
pci_host = true

# The Raspberry Pi 4's VL805 USB controller, by its node (it has no compatible
# string): it has the firmware load the controller, claims it through pci_v1,
# brings it up, checks a command completes on its MSI, and resets the USB 2
# ports a device is connected to, logging each step.
[[driver]]
name = "xhci"
binary = "usb-hcd-xhci"
interfaces = "../../../drivers/usb-hcd-xhci/interfaces"
nodes = ["/scb/pcie@7d500000/pci@1,0/usb@1,0"]
memory = 262144

# The Raspberry Pi 5's RP1 behind the root port, by its node (it has no
# compatible string either): it claims the function through pci_v1, logs its
# BARs and first register, and checks that it has no MSI (RP1 has MSI-X only).
[[driver]]
name = "pci_probe"
binary = "pci-probe"
interfaces = "../../../userspace/tests/pci/probe/interfaces"
nodes = ["/axi/pcie@1000120000/rp1"]

# The root dispatcher: Kickstart binds it once every other program and driver
# is loaded, and registers the boot Thread with it.
[[component]]
name = "dispatcher"
binary = "root-dispatcher"
active = true
program = true
dispatcher = true
