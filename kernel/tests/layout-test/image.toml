# What layout-test bundles (see vesper-image-build): the mailbox and fb
# components, the compositor driving the framebuffer as its one output, and the
# layout client twice: as `arranger`, which may arrange the outputs
# (`layout = true`), and as `reader`, which may only read them.

# The compositor, fb and the clients import interfaces of components this image
# does not bundle (the log server's log_v1, the USB HID component's input_v1):
# those imports stay unlinked.
interfaces = ["../../../userspace/log-server/interfaces", "../../../drivers/usb-hid/interfaces"]

[[driver]]
name = "mailbox"
binary = "mailbox"
interfaces = "../../../drivers/mailbox/interfaces"

[[driver]]
name = "fb"
binary = "fb"
interfaces = "../../../drivers/fb/interfaces"
exports = ["../../../drivers/display/interfaces"]
video_memory = true

[[component]]
name = "compositor"
binary = "compositor"
interfaces = "../../../userspace/gui/compositor/interfaces"
active = true
program = true
memory = 33554432

[[component]]
name = "arranger"
binary = "layout-client"
interfaces = "../../../userspace/tests/layout/client/interfaces"
active = true
program = true
layout = true

[[component]]
name = "reader"
binary = "layout-client"
interfaces = "../../../userspace/tests/layout/client/interfaces"
active = true
program = true

# The root dispatcher: Kickstart binds it once every other program and driver
# is loaded, and registers the boot Thread with it.
[[component]]
name = "dispatcher"
binary = "root-dispatcher"
active = true
program = true
dispatcher = true
