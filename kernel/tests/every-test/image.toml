# What every-test bundles (see vesper-image-build): three programs exporting
# echo_v1 (one binary, loaded under three names) and a client that imports it
# `via every max 2`, so Kickstart links it to the first two in load order.

[[component]]
name = "echo_a"
binary = "every-echo"
interfaces = "../../../userspace/tests/every/interfaces"
active = true
program = true

[[component]]
name = "echo_b"
binary = "every-echo"
interfaces = "../../../userspace/tests/every/interfaces"
active = true
program = true

[[component]]
name = "echo_c"
binary = "every-echo"
interfaces = "../../../userspace/tests/every/interfaces"
active = true
program = true

[[component]]
name = "client"
binary = "every-client"
interfaces = "../../../userspace/tests/every/client/interfaces"
active = true
program = true

# The root dispatcher: Kickstart binds it once every other program and driver
# is loaded, and registers the boot Thread with it.
[[component]]
name = "dispatcher"
binary = "root-dispatcher"
active = true
program = true
dispatcher = true
