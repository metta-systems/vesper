# What driver-test bundles (see vesper-image-build): the probe driver, loaded
# by Kickstart once per enabled device tree node it serves. Its interface
# directory declares the echo_v1 interface it exports and the imports.if
# wiring the instances to each other.

[[driver]]
name = "probe"
binary = "driver-probe"
interfaces = "../../../userspace/tests/driver/probe/interfaces"
priority = 0x8000
