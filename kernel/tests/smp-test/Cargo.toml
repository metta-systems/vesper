[package]
name = "smp-test"

description = "Vesper end-to-end test kernel: the secondary cores come online through the start-method component, report their affinity and logical index, and pass a cross-core cacheable counter."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
default = []
debug_kernel = ["kickstart/debug_kernel", "libkicktest/debug_kernel", "nucleus/debug_kernel"]
# Enable JTAG debugging of the test kernel - enable jtag helpers and
# block waiting for JTAG probe attach at the start of kernel main.
jtag = ["kickstart/jtag"]
noserial = []
# Build for running under QEMU with semihosting, so various halt/reboot options would for example quit QEMU instead.
qemu = ["kickstart/qemu", "libkicktest/qemu", "nucleus/qemu"]

[dependencies]
kickstart = { workspace = true, features = ["smp_test"] }
libboot = { workspace = true }
libcpu = { workspace = true }
libkicktest = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libqemu = { workspace = true }
nucleus = { workspace = true }

[[bin]]
name = "smp-test"
test = false  # the e2e assertions run in-guest through `just _test-smp`

[lints]
workspace = true
