[package]
name = "fp-test"

description = "Vesper end-to-end test kernel: FP/SIMD state per AddressSpace across preemption, Calls and a handled fault."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
default = []
debug_kernel = ["kickstart/debug_kernel", "libkicktest/debug_kernel", "libobject/debug_kernel", "nucleus/debug_kernel"]
jtag = ["kickstart/jtag"]
noserial = []
# Build for running under QEMU with semihosting, so exit reports the result.
qemu = [
  "kickstart/qemu",
  "libexception/qemu",
  "libkicktest/qemu",
  "libmachine/qemu",
  "nucleus/qemu",
]
# The nucleus's kernel-entry FP guard, for measuring what it costs.
fp_entry_trap = [
  "nucleus/fp_entry_trap",
]

[dependencies]
aarch64-cpu = { workspace = true }
cfg-if = { workspace = true }
fp-test-protocol = { workspace = true }
fp-trap-protocol = { workspace = true }
kickstart = { workspace = true }
libaddress = { workspace = true }
libboot = { workspace = true }
libcomponent-loader = { workspace = true }
libcpu = { workspace = true }
libexception = { workspace = true }
libimage = { workspace = true }
libkicktest = { workspace = true }
libmachine = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libqemu = { workspace = true }
nucleus = { workspace = true }

[build-dependencies]
libimage-build = { workspace = true }

[[bin]]
name = "fp-test"
test = false  # the e2e assertions run in-guest through `just _test-fp`

[lints]
workspace = true
