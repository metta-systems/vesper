# What display-test bundles (see vesper-image-build): the mailbox and fb
# components, loaded for the VideoCore mailbox and framebuffer nodes, and a
# probe program that checks the fb component through display_v1, the
# interface every display output exports. The probe has no device tree node:
# it finds the framebuffer node by its compatible string. Its lines go to the
# log server, which holds the PL011, so on a board the UART shows the modes
# the display's EDID names.

[[driver]]
name = "uart"
binary = "uart-pl011"

[[component]]
name = "log_server"
binary = "log-server"
interfaces = "../../../userspace/log-server/interfaces"
active = true
program = true
serial = true

[[driver]]
name = "mailbox"
binary = "mailbox"
interfaces = "../../../drivers/mailbox/interfaces"

[[driver]]
name = "fb"
binary = "fb"
interfaces = "../../../drivers/fb/interfaces"
exports = ["../../../drivers/display/interfaces"]
video_memory = true

[[component]]
name = "probe"
binary = "display-test-probe"
interfaces = "../../../userspace/tests/display/probe/interfaces"
active = true
program = true

# The root dispatcher: Kickstart binds it once every other program and driver
# is loaded, and registers the boot Thread with it.
[[component]]
name = "dispatcher"
binary = "root-dispatcher"
active = true
program = true
dispatcher = true
