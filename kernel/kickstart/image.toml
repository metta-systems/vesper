# What kickstart embeds (see vesper-image-build). `binary` is the cargo
# binary name, built with the nucleus linker script.

[nucleus]
binary = "nucleus"

# Privileged (EL1) components, built position-independent with
# drivers/privileged.ld (`just build-privileged`). Kickstart loads the
# interrupt controller whose `compatible` list matches the device tree's root
# interrupt controller; one image carries them all.

[[privileged]]
name = "bcm2836"
binary = "irqchip-bcm2836"

[[privileged]]
name = "gicv2"
binary = "irqchip-gicv2"

# EL0 device drivers, built with userspace/runtime/user.ld (`just
# build-drivers`). Kickstart loads one instance per enabled device tree node
# whose `compatible` list names one of a driver's strings.

[[driver]]
name = "uart"
binary = "uart-pl011"
priority = 0x8000

# The VideoCore mailbox component: on the Raspberry Pi 3 its registers share
# the BCM interrupt controller's page, which Kickstart hands it as a device
# Frame (`privileged::SHARES_KERNEL_PAGES`).
[[driver]]
name = "mailbox"
binary = "mailbox"
interfaces = "../../drivers/mailbox/interfaces"
priority = 0x8000

# The power control: the power management node's registers halt and reset the
# board; powering devices off goes through the mailbox component.
[[driver]]
name = "power"
binary = "power"
interfaces = "../../drivers/power/interfaces"
priority = 0x8000

# The display: configures the framebuffer through the mailbox component.
[[driver]]
name = "fb"
binary = "fb"
interfaces = "../../drivers/fb/interfaces"
video_memory = true
priority = 0x8000
