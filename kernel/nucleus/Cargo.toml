[package]
name = "nucleus"

description = "Vesper nanokernel privileged nucleus binary."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[badges]
maintenance = { status = "experimental" }

[features]
default = []
# Opt in to debug-only kernel capabilities; never enable in production kernels. It turns
# on the FP entry guard, the run-time check of `_audit-fp-simd`.
debug_kernel = ["fp_entry_trap"]
# Test-only: absorb FP/SIMD access traps for `fp-trap-test` (see `absorb_fp_simd_trap`), and run its
# kernel probe on request (`run_kernel_fp_probe`); never enable in production kernels.
fp_trap_test = ["dep:fp-trap-protocol"]
# Test-only: the IPI round trip of `smp-test` (`IPI_PING`/`IPI_PONG` and the ping SVC, see
# `smp_test_ping`); never enable in production kernels.
smp_test = []
# Trap FP/SIMD while the kernel runs, also when entered from an FP frame (`FpEntryGuard`);
# on in debug kernels, off in release kernels.
fp_entry_trap = []
# Enable JTAG debugging of kernel - enable jtag helpers and
# block waiting for JTAG probe attach at the start of kernel main.
jtag = ["libmachine/jtag"]
noserial = [] #"libplatform/noserial"
# Build for running under QEMU with semihosting, so various halt/reboot options would for example quit QEMU instead.
qemu = [
  "libconsole/qemu",
  "libexception/qemu",
  "libmachine/qemu",
  # "libplatform/qemu",
]

[dependencies]
aarch64-cpu = { workspace = true }
# bitflags = { workspace = true }
cfg-if = { workspace = true }
# fp-trap-test's probe instruction and kernel-probe request (`fp_trap_test` only).
fp-trap-protocol = { workspace = true, optional = true }
libaddress = { workspace = true }
# The polled PL011 a panic takes the console UART over with.
libboot-uart = { workspace = true }
libconsole = { workspace = true }
libcpu = { workspace = true }
libexception = { workspace = true }
libirqchip = { workspace = true }
liblocking = { workspace = true }
liblog = { workspace = true }
libmachine = { workspace = true }
libmapping = { workspace = true }
libobject = { workspace = true }
libprint = { workspace = true }
libqemu = { workspace = true }
# Stack traces on a panic, an unexpected exception and an EL0 fault
# (`--cfg stacktrace`).
libstacktrace = { workspace = true }
owo-colors = { workspace = true }
tock-registers = { workspace = true }

[dev-dependencies]
libboot = { workspace = true }
# Test binaries have no UART console registered, so libconsole's semihosting
# mirror is their only output path. It is gated on libconsole's own `qemu`
# feature (cfg(test) does not apply to dependencies of a test binary).
libconsole = { workspace = true, features = ["qemu"] }
libexception = { workspace = true, features = ["test_build"] }
liblocking = { workspace = true }
libqemu = { workspace = true }
libtest = { workspace = true }

[build-dependencies]
# build-rs = { workspace = true }

[lib]
# The object modules' unit tests use the custom QEMU test framework and run in
# the integration-test binaries (via `#[path]`), not as lib unit tests.
test = false

[[bin]]
name = "nucleus"
test = false  # test are all concentrated in integration tests/

[[test]]
name = "debug_console"
required-features = ["debug_kernel"]

[lints]
workspace = true
