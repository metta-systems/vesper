[package]
name = "dma-bcm2835"

description = "The dma component: owner of the BCM2835 DMA controller, handing out channels and running chains of control blocks for its clients through the dma_v1 interface."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

publish = false

[features]
default = []
# Opt in to standard host integration tests of the channel allocation and control blocks.
host-tests = []
qemu = ["libuser/qemu"]

[dependencies]
arbitrary-int = { workspace = true }
bitbybit = { workspace = true }
derive-mmio = { workspace = true }
libmmio = { workspace = true }

# The component itself only builds for Vesper; host tests use the library.
[target.'cfg(target_os = "vesper")'.dependencies]
dma = { workspace = true }
libdevice-driver = { workspace = true }
libmeddle-runtime = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libuser = { workspace = true }

[lib]
test = false
harness = false

[[test]]
name = "dma"
required-features = ["host-tests"]

[[bin]]
name = "dma-bcm2835"
path = "src/main.rs"
test = false

[lints]
workspace = true
