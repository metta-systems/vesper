[package]
name = "sdhost-bcm2835"

description = "EL0 driver component for the BCM2835 SDHOST controller: brings up the SD card and serves block_v1's request queue by programmed IO."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

publish = false

[features]
default = []
# Opt in to standard host integration tests of the card protocol and register values.
host-tests = []
qemu = ["libuser/qemu"]

[dependencies]
arbitrary-int = { workspace = true }
bitbybit = { workspace = true }
block = { workspace = true }
derive-mmio = { workspace = true }
libmmio = { workspace = true }

# The component itself only builds for Vesper; host tests use the library.
[target.'cfg(target_os = "vesper")'.dependencies]
gpio-client = { workspace = true }
libblock-channel = { workspace = true }
libdevice-driver = { workspace = true }
libio-channel = { workspace = true }
libmeddle-runtime = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libuser = { workspace = true }
mailbox-client = { workspace = true }

[lib]
test = false
harness = false

[[bin]]
name = "sdhost-bcm2835"
path = "src/main.rs"
test = false

[[test]]
name = "sdhost"
required-features = ["host-tests"]

[lints]
workspace = true
