[package]
name = "sdhci"

description = "EL0 driver component for standard SD host controllers (the Raspberry Pi 4's EMMC2, the Raspberry Pi 5's SD controller): brings up the SD card and serves block_v1's request queue by ADMA2 or the data port, interrupt driven."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

publish = false

[features]
default = []
# Opt in to standard host integration tests of the register values and descriptors.
host-tests = []
# Also serve the Arasan controller (`brcm,bcm2835-sdhci`), which holds QEMU's card.
qemu = ["libuser/qemu", "liblog-client/qemu"]

[dependencies]
arbitrary-int = { workspace = true }
bitbybit = { workspace = true }
block = { workspace = true }
derive-mmio = { workspace = true }
libmmio = { workspace = true }
libsd-card = { workspace = true }

# The component itself only builds for Vesper; host tests use the library.
[target.'cfg(target_os = "vesper")'.dependencies]
libblock-channel = { workspace = true }
libdevice-driver = { workspace = true }
libio-channel = { workspace = true }
liblog-client = { workspace = true }
libmeddle-runtime = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libuser = { workspace = true }
mailbox-client = { workspace = true }

[lib]
test = false
harness = false

[[bin]]
name = "sdhci"
path = "src/main.rs"
test = false

[[test]]
name = "sdhci"
required-features = ["host-tests"]

[lints]
workspace = true
