[package]
name = "gpio-bcm2835"

description = "The gpio component: owner of the BCM2835 GPIO block, switching pin functions through the gpio_v1 interface."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

publish = false

[features]
default = []
# Opt in to standard host integration tests of the register values.
host-tests = []
qemu = ["libuser/qemu"]

[dependencies]
arbitrary-int = { workspace = true }
bitbybit = { workspace = true }
derive-mmio = { workspace = true }
gpio = { workspace = true }
libmmio = { workspace = true }

[target.'cfg(target_os = "vesper")'.dependencies]
libdevice-driver = { workspace = true }
libmeddle-runtime = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libuser = { workspace = true }

[lib]
test = false
harness = false

[[test]]
name = "gpio"
required-features = ["host-tests"]

[[bin]]
name = "gpio-bcm2835"
path = "src/main.rs"
test = false

[lints]
workspace = true
