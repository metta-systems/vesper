[package]
name = "mailbox-impl"

description = "The mailbox component: serves the VideoCore property mailbox to other components through the mailbox_v1 interface."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

publish = false

[features]
default = []
qemu = ["libuser/qemu"]

[dependencies]
mailbox = { workspace = true }

[target.'cfg(target_os = "vesper")'.dependencies]
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libuser = { workspace = true }

[[bin]]
name = "mailbox"
path = "src/main.rs"
test = false

[lints]
workspace = true
