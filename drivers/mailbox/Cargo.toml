[package]
name = "mailbox-impl"

description = "The mailbox component: serves the VideoCore property mailbox to other components through the mailbox_v1 interface."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

publish = false

[features]
# Opt in to standard host integration tests of the property buffer checks.
host-tests = []
default = []
qemu = ["libuser/qemu"]

[dependencies]
mailbox = { workspace = true }

[target.'cfg(target_os = "vesper")'.dependencies]
libaddress = { workspace = true }
libdevice-driver = { workspace = true }
libmmio = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libuser = { workspace = true }
tock-registers = { workspace = true }

[lib]
test = false
harness = false

[[test]]
name = "tags"
required-features = ["host-tests"]

[[bin]]
name = "mailbox"
path = "src/main.rs"
test = false

[lints]
workspace = true
