[package]
name = "fb-impl"

description = "The framebuffer component: configures the display through the firmware's mailbox, behind the fb_v1 interface."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = false
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
default = []
# Opt in to standard host integration tests of the property buffers.
host-tests = []
qemu = ["libuser/qemu"]

[dependencies]
fb = { workspace = true }
mailbox-impl = { workspace = true }

[target.'cfg(target_os = "vesper")'.dependencies]
libdevice-driver = { workspace = true }
libmeddle-runtime = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libuser = { workspace = true }
mailbox-client = { workspace = true }

[lib]
test = false
harness = false

[[test]]
name = "requests"
required-features = ["host-tests"]

[[bin]]
name = "fb"
path = "src/main.rs"
test = false

[lints]
workspace = true
