[package]
name = "pcie-brcmstb"

description = "EL0 driver component for the Broadcom STB PCIe root complex (the Raspberry Pi 4's and 5's): brings the bridge and its link up, opens its windows, sets up MSIs, enumerates the buses behind it and assigns their BARs."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

publish = false

[features]
default = []
# Opt in to standard host integration tests of the register sequence.
host-tests = []
qemu = ["libuser/qemu", "liblog-client/qemu"]

[dependencies]
arbitrary-int = { workspace = true }
bitbybit = { workspace = true }
libpci = { workspace = true }

# The component itself only builds for Vesper; host tests use the library.
[target.'cfg(target_os = "vesper")'.dependencies]
libdevice-driver = { workspace = true }
liblog-client = { workspace = true }
libmeddle-runtime = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libuser = { workspace = true }

[lib]
test = false
harness = false

[[bin]]
name = "pcie-brcmstb"
path = "src/main.rs"
test = false

[[test]]
name = "pcie"
required-features = ["host-tests"]

[lints]
workspace = true
