[package]
name = "spi-bcm2835"

description = "The spi component: owner of the BCM2835/BCM2711 SPI0 block, writing transactions to the devices on the bus through the spi_v1 interface (polled, GPIO chip selects)."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

publish = false

[features]
default = []
# Opt in to standard host integration tests of the divisor and write sequence.
host-tests = []
qemu = ["libuser/qemu"]

[dependencies]
arbitrary-int = { workspace = true }
bitbybit = { workspace = true }
derive-mmio = { workspace = true }
libmmio = { workspace = true }

# The component itself only builds for Vesper; host tests use the library.
[target.'cfg(target_os = "vesper")'.dependencies]
gpio-client = { workspace = true }
libdevice-driver = { workspace = true }
libdevicetree = { workspace = true }
libmeddle-runtime = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libuser = { workspace = true }
mailbox-client = { workspace = true }
spi = { workspace = true }

[lib]
test = false
harness = false

[[test]]
name = "spi"
required-features = ["host-tests"]

[[bin]]
name = "spi-bcm2835"
path = "src/main.rs"
test = false

[lints]
workspace = true
