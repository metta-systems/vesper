[package]
name = "irqchip-bcm2836"

description = "Privileged interrupt-controller component for the BCM2836/7 local controller and the cascaded BCM2835 ARM-control block (Raspberry Pi 3)."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

publish = false

[features]
