[package]
name = "panel-ili9341"

description = "The ILI9341 SPI panel driver (the MSP2202 2.2\" 240x320 module): reads its node from its device tree copy, drives the panel through mipidsi over spi_v1 and gpio_v1, and lights it with colour bars."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

publish = false

[features]
default = []
qemu = ["libuser/qemu"]

# The component itself only builds for Vesper.
[target.'cfg(target_os = "vesper")'.dependencies]
embedded-graphics-core = { workspace = true }
embedded-hal = { workspace = true }
gpio-client = { workspace = true }
libdevice-driver = { workspace = true }
libdevicetree = { workspace = true }
libmeddle-runtime = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libserial-trace = { workspace = true }
libuser = { workspace = true }
mipidsi = { workspace = true }
spi-client = { workspace = true }

[[bin]]
name = "panel-ili9341"
path = "src/main.rs"
test = false

[lints]
workspace = true
