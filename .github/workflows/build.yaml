name: Build

on:
  push:
    branches:
      - "*"
  pull_request:

jobs:
  check_formatting:
    name: "Check Formatting"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v6.0.2
      - uses: "./.github/shared/setup"
      - run: just fmt-check

  clippy:
    name: "Clippy"
    needs: check_formatting
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 10
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v6.0.2
      - uses: "./.github/shared/setup"
      - run: just clippy

  test:
    name: Test
    needs: check_formatting
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v6.0.2
      - uses: "./.github/shared/setup"
      - uses: "./.github/shared/qemu"
      - name: "Build kernel"
        run: just build
      - name: "Run tests"
        run: just test
