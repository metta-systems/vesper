[package]
name = "vesper-cpu"

description = "Vesper nanokernel CPU support."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

publish = false

[package.metadata.layer]
deps = []
description = ""

[badges]
maintenance = { status = "experimental" }

[features]
# Opt in to standard host integration tests of the pure parts (the cache
# set/way operands).
host-tests = []

[dependencies]
aarch64-cpu = { workspace = true }
tock-registers = { workspace = true }

# Tests are offloaded to kernel integration tests binary.
[lib]
test = false
harness = false

# For proper testing in libcpu, we build it as a test_runner binary!

[[test]]
name = "cache"
required-features = ["host-tests"]

[lints]
workspace = true
