[package]
name = "vesper-serial-channel"

description = "What a serial driver and its client agree on: the control page with its transmit and receive IO channels, the data area's address, and the keys a client installs in the driver's table."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

publish = false

[dependencies]
libio-channel = { workspace = true }

[features]
# Opt in to standard host integration tests, not the freestanding test-device workflow.
host-tests = []

# Shared by EL0 drivers and their clients; host integration tests opt in above.
[lib]
test = false
harness = false

[[test]]
name = "serial_channel"
required-features = ["host-tests"]

[lints]
workspace = true
