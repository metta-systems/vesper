[package]
name = "vesper-serial-channel"

description = "What a serial driver and its client agree on: the shared channel page with its transmit and receive rings, and the keys a client installs in the driver's table."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

publish = false

[features]
