[package]
name = "vesper-kicktest"

description = "Shared boot-test scaffolding for Vesper e2e test kernels (kernel/tests/*): the Bounce fixture, fixture Threads, device checks and the panic handler."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
default = []
debug_kernel = ["kickstart/debug_kernel", "libobject/debug_kernel", "nucleus/debug_kernel"]
# Under QEMU a panic exits through semihosting with a failure status.
qemu = ["kickstart/qemu", "nucleus/qemu"]
# The suite runs on core 1: `dispatcher::suite_root` names core 1's roots, so
# `dispatcher::init` moves the boot Thread there.
on_core1 = []

[dependencies]
aarch64-cpu = { workspace = true }
cfg-if = { workspace = true }
kickstart = { workspace = true }
libaddress = { workspace = true }
libcomponent-loader = { workspace = true }
libcpu = { workspace = true }
libdevicetree = { workspace = true }
libexception = { workspace = true }
libimage = { workspace = true }
libirqchip = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libqemu = { workspace = true }
nucleus = { workspace = true }

[lib]
# Boot-test scaffolding; exercised by the e2e test kernels, not a harness.
test = false
harness = false

[lints]
workspace = true
