[package]
name = "vesper-kicktest"

description = "Shared boot-test scaffolding for Vesper e2e test kernels (kicktest, endpoint-test): key helpers, retained-image/AddressSpace provisioning, fixture Threads and the panic handler."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
default = []
debug_kernel = ["kickstart/debug_kernel", "libobject/debug_kernel", "nucleus/debug_kernel"]
# Under QEMU a panic exits through semihosting with a failure status.
qemu = ["kickstart/qemu", "nucleus/qemu"]

[dependencies]
aarch64-cpu = { workspace = true }
cfg-if = { workspace = true }
kickstart = { path = "../../kernel/kickstart" }
libaddress = { workspace = true }
libcpu = { workspace = true }
libexception = { workspace = true }
libimage = { workspace = true }
libobject = { workspace = true }
# libqemu's semihosting print macros expand to ::libprint::format_cstr().
libprint = { workspace = true }
libqemu = { workspace = true }
nucleus = { path = "../../kernel/nucleus" }

[lints]
workspace = true
