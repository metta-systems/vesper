[package]
name = "vesper-locking"

description = "Vesper nanokernel synchronization primitives."

authors = { workspace = true }
categories = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

publish = false

[badges]
maintenance = { status = "experimental" }

[features]
# Opt in to the standard host tests of the ticket lock.
host-tests = []

[dependencies]
libkernel-state = { workspace = true }
liblocal-irq = { workspace = true }

# The bare-metal test kernel `tests/locking.rs`; the host tests need none of these.
[target.'cfg(target_os = "vesper")'.dev-dependencies]
libboot = { workspace = true }
libconsole = { workspace = true }
liblog = { workspace = true }
libqemu = { workspace = true }
libtest = { workspace = true }

[lib]
test = false
harness = false

[[test]]
name = "ticket_lock"
required-features = ["host-tests"]

[lints]
workspace = true
