[package]
name = "chainboot"
description = "Chain boot loader"
authors = { workspace = true }
categories = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[badges]
maintenance = { status = "experimental" }

[features]
default = []
# Build for running under QEMU with semihosting, so various halt/reboot options would for example quit QEMU instead.
qemu = ["libconsole/qemu", "libmachine/qemu"]
# Build for debugging it over JTAG/SWD connection - halts on first non-startup function start.
jtag = ["libmachine/jtag"]
# Dummy feature, ignored in this crate.
noserial = []
# Run with the MMU on, on a flat identity map (see `platform::mmu`), and turn it off before the kernel runs.
mmu = []

[dependencies]
aarch64-cpu = { workspace = true }
arbitrary-int = { workspace = true }
bitbybit = { workspace = true }
libboot-uart = { workspace = true }
libchainboot-protocol = { workspace = true }
libconsole = { workspace = true }
liblocking = { workspace = true }
liblog = { workspace = true }
libmachine = { workspace = true }
libprint = { workspace = true }
libtime = { workspace = true }
libqemu = { workspace = true }
seahash = { workspace = true }
tock-registers = { workspace = true }

[dev-dependencies]
libqemu = { workspace = true }
libtest = { workspace = true }

[[bin]]
name = "chainboot"
test = false

[lints]
workspace = true
