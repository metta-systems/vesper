[package]
name = "chainboot"
description = "Chain boot loader"
authors = { workspace = true }
categories = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[badges]
maintenance = { status = "experimental" }

[features]
default = []
# Build for running under QEMU with semihosting, so various halt/reboot options would for example quit QEMU instead.
qemu = ["libmachine/qemu"]
# Build for debugging it over JTAG/SWD connection - halts on first non-startup function start.
jtag = ["libmachine/jtag"]
# Dummy feature, ignored in this crate.
noserial = []

[dependencies]
aarch64-cpu = { workspace = true }
bit_field = { workspace = true }
bitflags = { workspace = true }
cfg-if = { workspace = true }
libconsole = { workspace = true }
liblog = { workspace = true }
libmachine = { workspace = true, features = ["no_boot"] }
seahash = { workspace = true }
snafu = { workspace = true }
tock-registers = { workspace = true }
usize_conversions = { workspace = true }
ux = { workspace = true }

[[bin]]
name = "chainboot"
test = false

[lints]
workspace = true
