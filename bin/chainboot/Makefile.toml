#
# Build chainboot binary
#
extend = "../../Makefile.toml"

[env]
CHAINBOOT_LINK = "bin/chainboot/src/link.ld"
CHAINBOOT_ELF = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/target/${TARGET}/release/chainboot"
CHAINBOOT_BIN = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/target/chainboot.bin"

[tasks.build]
clear = true
dependencies = ["build-target-chainboot", "convert-kernel-binary"]
script_runner = "@duckscript"
script = '''
    shortBinary = replace ${KERNEL_BIN} "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/" ""

    echo
    echo ✅ chainboot built for hw ${TARGET_BOARD} ${BOARD_RUSTFLAGS}.
    echo
    echo 🎠 Run the following command in your terminal:
    echo 🎠 target/debug/chainofcommand ${CHAINBOOT_SERIAL} ${CHAINBOOT_BAUD} --kernel ${shortBinary}
    echo
'''

[tasks.build-target-chainboot]
env = { TARGET_BOARD = "rpi4", TARGET_LINK_RUSTFLAGS = "-C link-arg=--script=${CHAINBOOT_LINK}", BOARD_RUSTFLAGS = "${BOARD_rpi4_RUSTFLAGS}" }
run_task = "build-target"

# Generate a bootable binary file from CHAINBOOT_ELF
[tasks.convert-kernel-binary]
workspace = false
env = { "BINARY_FILE" = "${CHAINBOOT_ELF}" }
extend = "convert-custom-binary"

[tasks.test-chainboot]
env = { TARGET_LINK_RUSTFLAGS = "-C link-arg=--script=${CHAINBOOT_LINK}" }
run_task = "test-on-rpi3-qemu"

[tasks.zellij]
workspace = false
env = { "KERNEL_BIN" = "${CHAINBOOT_BIN}", "QEMU_OPTS" = "${QEMU_OPTS} ${QEMU_DISASM_OPTS}" }
extend = "zellij-config"

[tasks.zellij-gdb]
workspace = false
env = { "KERNEL_BIN" = "${CHAINBOOT_BIN}", "QEMU_OPTS" = "${QEMU_OPTS} ${QEMU_DISASM_OPTS} ${QEMU_GDB_OPTS}", "TARGET_BOARD" = "rpi3", "TARGET_DTB" = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/targets/bcm2710-rpi-3-b-plus.dtb" }
extend = "zellij-config"

[tasks.qemu]
workspace = false
env = { "QEMU_RUNNER_OPTS" = "${QEMU_DISASM_OPTS} -serial pty", "KERNEL_BIN" = "${CHAINBOOT_BIN}", "TARGET_DTB" = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/targets/bcm2710-rpi-3-b-plus.dtb" }
extend = "qemu-runner"

[tasks.qemu-gdb]
workspace = false
env = { "QEMU_RUNNER_OPTS" = "${QEMU_DISASM_OPTS} ${QEMU_GDB_OPTS} -serial pty", "KERNEL_BIN" = "${CHAINBOOT_BIN}", "TARGET_DTB" = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/targets/bcm2710-rpi-3-b-plus.dtb" }
extend = "qemu-runner"

[tasks.gdb]
workspace = false
dependencies = ["build", "build-kernel-binary", "gdb-config"]
env = { "RUST_GDB" = "${GDB}" }
script = ["exec < /dev/tty && rust-gdb -x ${GDB_CONNECT_FILE} ${CHAINBOOT_ELF}"]

[tasks.sdcard]
workspace = false
dependencies = ["build", "build-kernel-binary"]
script_runner = "@duckscript"
script = [
  '''
    kernelImage = set "chain_boot_rpi4.img"
    cp ${CHAINBOOT_BIN} ${VOLUME}/${kernelImage}
    echo 🔄 Copied chainboot to ${VOLUME}/${kernelImage}
''',
]

# Just use sdeject
# [tasks.cb-eject]
# clean = true
# alias = "cb-eject-chainboot"
#
# [tasks.cb-eject-chainboot]
# dependencies = ["sdeject"]

[tasks.clippy]
clear = true
dependencies = ["clippy-rpi3", "clippy-rpi4"]

[tasks.clippy-rpi3]
env = { TARGET_BOARD = "rpi3", TARGET_LINK_RUSTFLAGS = "-C link-arg=--script=${CHAINBOOT_LINK}", BOARD_RUSTFLAGS = "${BOARD_rpi3_RUSTFLAGS}" }
run_task = "xtool-clippy"

[tasks.clippy-rpi4]
env = { TARGET_BOARD = "rpi4", TARGET_LINK_RUSTFLAGS = "-C link-arg=--script=${CHAINBOOT_LINK}", BOARD_RUSTFLAGS = "${BOARD_rpi4_RUSTFLAGS}" }
run_task = "xtool-clippy"
