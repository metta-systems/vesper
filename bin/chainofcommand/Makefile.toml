#
# Build chainofcommand tool
#
extend = "../../Makefile.toml"

[tasks.build]
alias = "build-coc"

[tasks.build-coc]
workspace = false
command = "cargo"
args = ["build"]

[tasks.test]
clear = true
command = "cargo"
args = ["test"]

[tasks.clippy]
clear = true
command = "cargo"
args = [
  "clippy",
  "--",
  "--no-deps",
  "--deny",
  "warnings",
  "--allow",
  "deprecated",
]
